[package]
name = "inkplate-tempera"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

# Inkplate 4 TEMPERA: ESP32 (Xtensa LX6), 600x600 e-paper (inkplate-tempera
# board extraction plan, Phase 2).
#
# Panel and waveform driver, ESP32 GPIO fast path, I/O expander, board power
# control, touch and IMU drivers, board geometry and constants, and their
# host-testable algorithms. It selects the chip for everything below it --
# the platform crates name no chip themselves. The `meditamer` product
# depends on this crate as a normal path dependency and owns task spawning,
# policy, persistence, telemetry, UI navigation, and service coordination.
#
# Most of this driver is inherently ESP32-only: the fast GPIO scan path pokes
# raw peripheral registers, and the waveform timing depends on `esp-hal`.
# Those pieces stay behind `cfg(target_os = "none")` (embedded targets report
# `target_os = "none"`; the host reports e.g. `"linux"`), the same split
# `platform/storage/sdcard` uses. Unlike `sdcard`, no `host-tests` feature is needed:
# the packing/state-machine/protocol logic that stays outside the gate has no
# hardware dependency of its own, so a plain host `cargo test` already
# exercises it.
[lib]

[dependencies]
board = { path = "../../platform/ui/board" }
buzzer = { path = "../../platform/audio/buzzer" }
bme68x = { version = "=0.2.0", default-features = false, features = ["async"] }
embassy-embedded-hal = "0.6.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
render = { path = "../../platform/ui/render", default-features = false }

[target.'cfg(target_os = "none")'.dependencies]
esp-hal = { version = "=1.2.0", features = ["esp32", "unstable"] }
esp-sync = "0.3.0"
esp32 = "0.42.0"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
embassy-time = { version = "0.5.1", features = ["mock-driver", "generic-queue-8"] }
critical-section = { version = "1.2.0", features = ["std"] }
