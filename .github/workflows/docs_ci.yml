name: Docs Advisory

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/ci/check_markdown_loc.sh"
      - "scripts/ci/check_script_surface.py"
      - "scripts/surface.json"
      - ".github/workflows/docs_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-loc:
    name: Markdown LOC Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Markdown LOC advisory
        run: scripts/ci/check_markdown_loc.sh

  script-surface:
    name: Script Surface Ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Script surface ratchet
        run: scripts/ci/check_script_surface.py
