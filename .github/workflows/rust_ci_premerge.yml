name: Firmware Heavy CI

on:
  pull_request:
    paths:
      - "src/main.rs"
      - "src/event_engine/**"
      - "src/inkplate_hal/**"
      - "src/firmware/storage/sd_task/**"
      - "packages/sdcard/**"
      - "scripts/ci/check_fat_engine_stackless.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "config/events.toml"
      - ".github/workflows/rust_ci_premerge.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-xtensa:
    name: Firmware Xtensa Build and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Firmware clippy
        run: cargo +esp clippy -Zbuild-std=core,alloc --target xtensa-esp32-none-elf --locked --all-features --workspace --bins --lib -- -D warnings
      - name: FAT engine stackless guard
        run: scripts/ci/check_fat_engine_stackless.sh
      - name: Firmware build release
        run: cargo +esp build -Zbuild-std=core,alloc --target xtensa-esp32-none-elf --locked --release
