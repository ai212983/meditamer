name: Firmware Heavy CI

on:
  pull_request:
    paths:
      - "src/**"
      - "config/linker/**"
      - "config/lvgl/**"
      - "config/partitions-ab.csv"
      - "packages/sdcard/**"
      - "tools/event_config_compiler/**"
      - "tools/ota_bootloader/**"
      - "scripts/build/build.sh"
      - "scripts/build/ota_bootloader.sh"
      - "scripts/build/xtensa_runner.sh"
      - "scripts/ci/check_*.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "config/events.toml"
      - ".github/workflows/rust_ci_premerge.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-xtensa:
    name: Firmware Xtensa Build and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          default: true
          buildtargets: esp32
          ldproxy: true
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Firmware profile builds and clippy
        run: scripts/ci/check_software_baseline.sh firmware
      - name: Firmware static guards
        run: scripts/ci/check_software_baseline.sh static
