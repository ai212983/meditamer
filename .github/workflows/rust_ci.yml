name: Host CI (manual)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Rust fmt check
        run: scripts/ci/check_software_baseline.sh source

  host-regression:
    name: Host Regression and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Install rust-code-analysis-cli
        run: cargo install --locked rust-code-analysis-cli --version 0.0.25
      - name: Install rust-analyzer component
        run: rustup component add rust-analyzer
      - name: Host regression and clippy baseline
        run: scripts/ci/check_software_baseline.sh host
      - name: Static source guards
        run: scripts/ci/check_software_baseline.sh static-source
      - name: Source quality baseline
        run: scripts/ci/check_software_baseline.sh quality

  host-coverage:
    name: Host Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Run host coverage
        run: scripts/ci/coverage_host.sh
      - name: Upload host coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: host-coverage
          path: logs/coverage/**
          if-no-files-found: error
