# ADR-0015: the workspace the platform/board/product split lands in. Members are
# this root package (still the Meditamer product plus its board code), the
# existing `packages/*`, and the `platform/*` crates as they are extracted.
#
# `exclude` is load-bearing rather than cosmetic. Cargo makes every path
# dependency inside the workspace directory a member automatically, which would
# otherwise pull in `vendor/*` (the `[patch.crates-io]` trees, which carry their
# own patch sections and must not be linted or resolved as first-party code),
# the `tools/*` build-dependency crates (host-only; ADR-0015 keeps `tools/`
# outside the workspace), and `.scratch/*` scratch crates.
[workspace]
# Explicit, not inherited. A workspace takes its resolver from
# `[workspace.resolver]`; the `resolver` under `[package]` below governs only
# that package. Resolver 2 is what keeps `packages/bundle`'s dev-dependency on
# ed25519-dalek (default features, std) from unifying into the firmware's
# verify-only `default-features = false` build.
resolver = "2"
members = [
    "packages/bundle",
    "packages/otadata",
    "packages/rtc",
    "packages/sdcard",
    "packages/shtc3",
    "platform/arbitration",
    "platform/board",
    "platform/console",
    "platform/render",
    "platform/shell",
]
exclude = [
    ".scratch",
    "boards",
    "test-support",
    "tools",
    "vendor",
]

[package]
name = "meditamer"
version = "0.1.0"
authors = ["Dimitri Fedorov <dimitri.fedorov@suprematic.net>"]
edition = "2021"
# `resolver` moved to `[workspace]` above (ADR-0015 step 1). Cargo rejects the
# field in both tables, and the workspace's setting is the one that governs.
rust-version = "1.95"

[[bin]]
name = "meditamer"
harness = false
test = false

# Factory updater (ADR-0014 / docs/archive/firmware-update/single-production-sd-recovery-updater.md).
# A separate release artifact from the production `meditamer` binary above;
# `required-features` keeps it out of a plain `cargo build` and out of the
# default feature set's wifi/BLE/upload weight, so its size reflects only
# what Phase 1 needs to measure.
[[bin]]
name = "updater"
path = "src/bin/updater.rs"
harness = false
test = false
required-features = ["factory-updater"]

[lib]
test = false
harness = false
bench = false
doctest = false

[profile.release]
opt-level = 3

[profile.ble-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.ble-release.package.esp-radio]
opt-level = 3

[profile.ble-release.package.esp-storage]
opt-level = 2

[profile.dev]
debug = true
opt-level = "z"

[profile.dev.package.esp-storage]
opt-level = 2

[profile.dev.package.esp-radio]
opt-level = 3

# Keep the retained radio IPC implementation within the vendor task stacks.
# Min-size optimization (`z`) makes its task-context wait loop exceed the
# debug stack cushion and overwrite the adjacent RTOS wait-queue control word.
[profile.dev.package.esp-radio-rtos-driver]
opt-level = "s"
codegen-units = 1

[features]
default = [
    "asset-upload-http",
    "asset-upload-http-pipeline",
]
telemetry-defmt = [
    "dep:defmt",
    "console/telemetry-defmt",
]
ui-provider-fixture = ["render/ui-provider-fixture"]
wifi-debug-slim-app = ["asset-upload-http"]
ble-foundation = [
    "asset-upload-http",
    "dep:bt-hci",
    "dep:embassy-sync-07",
    "dep:trouble-host",
    "esp-radio/ble",
    "esp-radio/coex",
]
asset-upload-http = [
    "dep:embassy-net",
    "dep:embedded-io-async",
    "esp-rtos/esp-radio",
    "esp-rtos/esp-alloc",
    "wifi-backend-esp-radio",
]
asset-upload-http-pipeline = ["asset-upload-http"]
wifi-backend-esp-radio = ["dep:esp-radio"]
# Selects the `updater` binary target. Build with --no-default-features so
# the wifi/BLE/upload dependency tree stays out of the measured size.
factory-updater = []
# Bench/qualification-only build variant of the `updater` binary (ADR-0014
# Phase 4): replaces the normal verify/install flow with a serial bundle
# receiver, so hostctl can stage a signed bundle onto a bench board's SD
# card without disassembling the device. Never the shipped updater — see
# src/updater/sd_push.rs's module doc.
sd-qual-push = ["factory-updater"]

[dependencies]
critical-section = "1.2.0"
esp-hal = { version = "=1.1.1", features = ["esp32", "unstable"] }
esp-sync = "0.2.1"
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy"] }
esp-radio-rtos-driver = "=0.3.0"
esp32 = "0.40.2"
esp-alloc = { version = "=0.10.0", default-features = false, features = ["alloc-hooks", "compat", "esp32", "global-allocator"] }
esp-backtrace = { version = "0.19.0", default-features = false, features = ["esp32", "panic-handler", "println"] }
defmt = { version = "1.1.1", optional = true }
esp-wifi-sys = { package = "esp-wifi-sys-esp32", version = "0.2.0", default-features = false }
embassy-executor = { version = "0.10.0", features = ["scheduler-priority"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-sync-07 = { package = "embassy-sync", version = "=0.7.2", optional = true }
embassy-futures = "0.1.2"
bt-hci = { version = "=0.8.1", optional = true }
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "=0.9.1", optional = true, features = ["dhcpv4", "medium-ethernet", "tcp"] }
embedded-hal-async = "1.0.0"
embedded-io-async = { version = "0.7.0", optional = true }
enumset = { version = "1.1.14", default-features = false }
esp-radio = { version = "=1.0.0-beta.0", optional = true, default-features = false, features = ["esp32", "wifi", "log-04", "unstable"] }
trouble-host = { version = "=0.6.0", optional = true, default-features = false, features = ["connection-event-queue-size-2", "derive", "gatt", "l2cap-rx-queue-size-2", "l2cap-tx-queue-size-2", "peripheral"] }
static_cell = "2.1.1"
lightvgl-sys = { version = "=9.5.4", default-features = false, features = ["library", "raw-bindings"] }

heapless = "0.9.3"
statig = "0.4.1"
esp-storage = { version = "0.9.0", features = ["esp32"] }
embedded-storage = "0.3.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
arbitration = { path = "platform/arbitration" }
# Not referenced in code: it selects the chip and console transport for the
# `console` crate, which names neither (ADR-0015).
esp-println-upstream = { package = "esp-println", version = "0.17.0", default-features = false, features = ["esp32", "log-04", "uart"] }
console = { path = "platform/console" }
render = { path = "platform/render" }
shell = { path = "platform/shell" }
sdcard = { path = "packages/sdcard" }
rtc = { path = "packages/rtc" }
bundle = { path = "packages/bundle" }
otadata = { path = "packages/otadata" }

[build-dependencies]
event_config_compiler = { path = "tools/event_config_compiler" }
lvgl_font_compiler = { path = "tools/lvgl_font_compiler" }

[patch.crates-io]
embassy-net = { path = "vendor/embassy-net-0.9.1-restartable" }
esp-alloc = { path = "vendor/esp-alloc-0.10.0-provenance" }
esp-backtrace = { path = "vendor/esp-backtrace-0.19.0-window-spill-fix" }
esp-radio = { path = "vendor/esp-radio-1.0.0-beta.0-bounded" }
esp-radio-rtos-driver = { path = "vendor/esp-radio-rtos-driver-0.3.0-retained" }
esp-rtos = { path = "vendor/esp-rtos-0.3.0-idle-context-fix" }
xtensa-lx-rt = { path = "vendor/xtensa-lx-rt-0.22.0-user-mode-vector-fix" }
