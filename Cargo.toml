[package]
name = "meditamer"
version = "0.1.0"
authors = ["Dimitri Fedorov <dimitri.fedorov@suprematic.net>"]
edition = "2021"
resolver = "2"
rust-version = "1.95"

[[bin]]
name = "meditamer"
harness = false
test = false

[lib]
test = false
harness = false
bench = false
doctest = false

[profile.release]
opt-level = 3

[profile.ble-release]
inherits = "release"
opt-level = "s"

[profile.ble-release.package.esp-radio]
opt-level = 3

[profile.ble-release.package.esp-storage]
opt-level = 2

[profile.dev]
debug = true
opt-level = "z"

[profile.dev.package.esp-storage]
opt-level = 2

[profile.dev.package.esp-radio]
opt-level = 3

[features]
default = [
    "asset-upload-http",
    "asset-upload-http-pipeline",
]
telemetry-defmt = ["dep:defmt", "esp-println/defmt-espflash"]
ui-provider-fixture = []
wifi-debug-slim-app = ["asset-upload-http"]
ble-foundation = [
    "asset-upload-http",
    "dep:embassy-sync-07",
    "dep:trouble-host",
    "esp-radio/ble",
    "esp-radio/coex",
]
asset-upload-http = [
    "dep:embassy-net",
    "dep:embedded-io-async",
    "esp-rtos/esp-radio",
    "esp-rtos/esp-alloc",
    "wifi-backend-esp-radio",
]
asset-upload-http-pipeline = ["asset-upload-http"]
wifi-backend-esp-radio = ["dep:esp-radio"]

[dependencies]
critical-section = "1.2.0"
esp-hal = { version = "1.1.1", features = ["esp32", "unstable"] }
esp-sync = "0.2.1"
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy"] }
esp32 = "0.40.2"
esp-alloc = { version = "0.10.0", default-features = false, features = ["compat", "esp32", "global-allocator"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32", "log-04", "uart"] }
esp-backtrace = { version = "0.19.0", default-features = false, features = ["esp32", "panic-handler", "println"] }
defmt = { version = "1.1.1", optional = true }
esp-wifi-sys = { package = "esp-wifi-sys-esp32", version = "0.2.0", default-features = false }
embassy-executor = { version = "0.10.0", features = ["scheduler-priority"] }
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
embassy-sync-07 = { package = "embassy-sync", version = "=0.7.2", optional = true }
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"
embassy-net = { version = "0.9.1", optional = true, features = ["dhcpv4", "medium-ethernet", "tcp"] }
embedded-hal-async = "1.0.0"
embedded-io-async = { version = "0.7.0", optional = true }
enumset = { version = "1.1.14", default-features = false }
esp-radio = { version = "=1.0.0-beta.0", optional = true, default-features = false, features = ["esp32", "wifi", "log-04", "unstable"] }
trouble-host = { version = "=0.6.0", optional = true, default-features = false, features = ["connection-event-queue-size-2", "derive", "gatt", "l2cap-rx-queue-size-2", "l2cap-tx-queue-size-2", "peripheral"] }
static_cell = "2.1.1"
lightvgl-sys = { version = "=9.5.4", default-features = false, features = ["library", "raw-bindings"] }

heapless = "0.9.3"
statig = "0.4.1"
esp-storage = { version = "0.9.0", features = ["esp32"] }
embedded-storage = "0.3.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
sha2 = { version = "0.10.9", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
sdcard = { path = "packages/sdcard" }

[build-dependencies]
event_config_compiler = { path = "tools/event_config_compiler" }

[patch.crates-io]
esp-radio = { path = "vendor/esp-radio-1.0.0-beta.0-bounded" }
esp-radio-rtos-driver = { path = "vendor/esp-radio-rtos-driver-0.3.0-retained" }
