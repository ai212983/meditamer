[package]
name = "console"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[lib]
test = false
harness = false
bench = false
doctest = false

[dependencies]
esp-hal = { version = "=1.1.1", features = ["esp32", "unstable"] }
# The upstream writer this crate arbitrates access to. Aliased for the same
# reason the root crate aliased it: `esp_println` is the name the macros used
# to be reached under, and keeping the alias makes the distinction explicit.
esp-println-upstream = { package = "esp-println", version = "0.17.0", default-features = false, features = [
    "esp32",
    "log-04",
    "uart",
] }

[features]
# Forwarded from the product's own `telemetry-defmt`. The feature lives here
# because this crate owns the `esp-println` dependency after ADR-0015 step 1.
telemetry-defmt = [
    "esp-println-upstream/critical-section",
    "esp-println-upstream/defmt-espflash",
]
