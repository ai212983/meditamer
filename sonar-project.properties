sonar.projectKey=Meditamer
sonar.projectName=Meditamer
sonar.sourceEncoding=UTF-8

# Analyze only repository source paths and ignore build/generated artifacts.
sonar.sources=src,tools,scripts,packages,build.rs
sonar.exclusions=target/**,logs/**,.scannerwork/**,.git/**,.github/**,docs/**,assets/**,**/out/**,**/__pycache__/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg
