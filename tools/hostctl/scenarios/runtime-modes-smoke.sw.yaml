document:
  dsl: "1.0.0"
  namespace: "hostctl"
  name: "runtime-modes-smoke"
  version: "1.0.0"
do:
  - baseline_state:
      call: "state_get"
      then: "initial_suite_gate"
  - initial_suite_gate:
      switch:
        - no_storage:
            when: ".suite == \"no-storage\""
            then: "no_storage_upload_off"
        - default:
            then: "full_ready"
  - no_storage_upload_off:
      call: "apply_mode"
      with:
        command: "STATE SET upload=off"
        expect_upload: "off"
        expect_ready: false
      then: "no_storage_ready"
  - no_storage_ready:
      call: "state_get"
      with:
        expect_upload: "off"
        expect_ready: true
      then: "baseline_psram"
  - full_ready:
      call: "state_get"
      with:
        expect_ready: true
      then: "baseline_psram"
  - baseline_psram:
      call: "psram_snapshot"
      with:
        label: "baseline"
      then: "action_suite_gate"
  - action_suite_gate:
      switch:
        - no_storage:
            when: ".suite == \"no-storage\""
            then: "print_summary"
        - default:
            then: "upload_on"
  - upload_on:
      call: "apply_mode"
      with:
        command: "STATE SET upload=on"
        expect_upload: "on"
      then: "init_post_upload_checks"
  - init_post_upload_checks:
      call: "init_post_upload_checks"
      metadata:
        hostctl:
          result:
            merge: true
      then: "post_upload_status_loop"
  - post_upload_status_loop:
      do:
        - run_post_upload_status_probe:
            call: "run_post_upload_status_probe"
      metadata:
        hostctl:
          repeat:
            in: ".post_upload_status_repeats"
            at: "post_upload_status_index"
      then: "post_upload_ping_loop"
  - post_upload_ping_loop:
      do:
        - run_post_upload_ping_probe:
            call: "run_post_upload_ping_probe"
      metadata:
        hostctl:
          repeat:
            in: ".post_upload_ping_repeats"
            at: "post_upload_ping_index"
      then: "upload_on_psram"
  - upload_on_psram:
      call: "psram_snapshot"
      with:
        label: "upload_on"
      then: "upload_off"
  - upload_off:
      call: "apply_mode"
      with:
        command: "STATE SET upload=off"
        expect_upload: "off"
      then: "upload_off_psram"
  - upload_off_psram:
      call: "psram_snapshot"
      with:
        label: "upload_off"
      then: "print_summary"
  - print_summary:
      call: "print_summary"
