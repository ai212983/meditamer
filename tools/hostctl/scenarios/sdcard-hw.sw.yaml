document:
  dsl: "1.0.0"
  namespace: "hostctl"
  name: "sdcard-hw"
  version: "1.0.0"
do:
  - boot_runtime_ready:
      call: "poll_command_pattern"
      with:
        name: "boot_runtime_ready"
        command: "STATE GET"
        response_pattern: "^STATE phase="
        expected_pattern: "^STATE phase=.* ready=true$"
        timeout_ms: 30000
        interval_ms: 100
      then: "initial_suite_gate"
  - initial_suite_gate:
      switch:
        - no_card:
            when: ".suite == \"no-card\""
            then: "no_card_upload_off"
        - default:
            then: "upload_mode_off"
  - no_card_upload_off:
      call: "poll_command_pattern"
      with:
        name: "no_card_upload_off"
        command: "STATE GET"
        response_pattern: "^STATE phase="
        expected_pattern: "^STATE phase=.* upload=off .* ready=true$"
        timeout_ms: 8000
        interval_ms: 100
      then: "upload_paused"
  - upload_mode_off:
      call: "raw_expect_pattern"
      with:
        name: "upload_mode_off"
        command: "STATE SET upload=off"
        expected_pattern: "^STATE OK"
        timeout_ms: 8000
      then: "upload_paused"
  - upload_paused:
      call: "poll_command_pattern"
      with:
        name: "upload_paused"
        command: "NET STATUS"
        response_pattern: "^NET_STATUS "
        expected_pattern: '^NET_STATUS .*"state":"Idle".*"link":false.*"radio_quiesced":true.*"ipv4":"0.0.0.0".*"listener":false'
        timeout_ms: 20000
        interval_ms: 100
      then: "storage_capability_gate"
  - storage_capability_gate:
      switch:
        - no_card:
            when: ".suite == \"no-card\""
            then: "no_card_telemetry"
        - default:
            then: "boot_storage_ready"
  - no_card_telemetry:
      call: "raw_expect_pattern"
      with:
        name: "no_card_telemetry"
        command: "TELEMSET SD ON"
        expected_pattern: "^TELEMSET OK .*sd=on"
      then: "no_card_touch_reset"
  - no_card_touch_reset:
      call: "raw_expect_pattern"
      with:
        name: "no_card_touch_reset"
        command: "TOUCHSCHEDRESET"
        expected_pattern: "^TOUCHSCHEDRESET OK"
      then: "no_card_probes"
  - no_card_probes:
      call: "repeat_step"
      with:
        repetitions: 20
        step:
          name: "no_card_probe_{iteration}"
          command: "SDPROBE"
          ack_tag: "SDPROBE"
          expected_status: "error"
          expected_code: "init_failed"
          expected_pattern: "retry_init_error.*NoResponse"
      then: "no_card_summary"
  - no_card_summary:
      call: "cutover_summary"
      with:
        label: "SD_NO_CARD_SUMMARY"
      then: "complete"
  - boot_storage_ready:
      call: "run_step"
      with:
        name: "boot_storage_ready"
        command: "SDPROBE"
        ack_tag: "SDPROBE"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "card_detected"
      then: "cutover_gate"
  - cutover_gate:
      switch:
        - cutover:
            when: ".suite == \"cutover\""
            then: "cutover_telemetry"
        - default:
            then: "probe"
  - cutover_telemetry:
      call: "raw_expect_pattern"
      with:
        name: "cutover_telemetry"
        command: "TELEMSET SD ON"
        expected_pattern: "^TELEMSET OK .*sd=on"
      then: "cutover_touch_reset"
  - cutover_touch_reset:
      call: "raw_expect_pattern"
      with:
        name: "cutover_touch_reset"
        command: "TOUCHSCHEDRESET"
        expected_pattern: "^TOUCHSCHEDRESET OK"
      then: "cutover_probes"
  - cutover_probes:
      call: "repeat_step"
      with:
        repetitions: 20
        step:
          name: "cutover_probe_{iteration}"
          command: "SDPROBE"
          ack_tag: "SDPROBE"
          expected_status: "ok"
          expected_code: "ok"
          expected_pattern: "card_detected"
      then: "cutover_nested_root"
  - cutover_nested_root:
      call: "run_step"
      with:
        name: "cutover_nested_root"
        command: "SDFATMKDIR {nested_root}"
        ack_tag: "SDFATMKDIR"
        expected_status: "ok"
        expected_code: "ok"
      then: "cutover_nested_dirs"
  - cutover_nested_dirs:
      call: "repeat_step"
      with:
        repetitions: 20
        step:
          name: "cutover_nested_dir_{iteration}"
          command: "SDFATMKDIR {nested_root}/d{iteration}"
          ack_tag: "SDFATMKDIR"
          expected_status: "ok"
          expected_code: "ok"
      then: "cutover_nested_writes"
  - cutover_nested_writes:
      call: "repeat_step"
      with:
        repetitions: 20
        step:
          name: "cutover_nested_write_{iteration}"
          command: "SDFATWRITE {nested_root}/d{iteration}/io.txt nested"
          ack_tag: "SDFATWRITE"
          expected_status: "ok"
          expected_code: "ok"
      then: "cutover_nested_remove_files"
  - cutover_nested_remove_files:
      call: "repeat_step"
      with:
        repetitions: 20
        step:
          name: "cutover_nested_remove_file_{iteration}"
          command: "SDFATRM {nested_root}/d{iteration}/io.txt"
          ack_tag: "SDFATRM"
          expected_status: "ok"
          expected_code: "ok"
      then: "cutover_nested_remove_dirs"
  - cutover_nested_remove_dirs:
      call: "repeat_step"
      with:
        repetitions: 20
        step:
          name: "cutover_nested_remove_dir_{iteration}"
          command: "SDFATRM {nested_root}/d{iteration}"
          ack_tag: "SDFATRM"
          expected_status: "ok"
          expected_code: "ok"
      then: "cutover_nested_remove_root"
  - cutover_nested_remove_root:
      call: "run_step"
      with:
        name: "cutover_nested_remove_root"
        command: "SDFATRM {nested_root}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
      then: "probe"
  - probe:
      call: "run_step"
      with:
        name: "probe"
        command: "SDPROBE"
        ack_tag: "SDPROBE"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "card_detected"
      then: "baseline_gate"
  - baseline_gate:
      switch:
        - run_baseline_cutover:
            when: ".suite == \"cutover\""
            then: "baseline_mkdir"
        - run_baseline_all:
            when: ".suite == \"all\""
            then: "baseline_mkdir"
        - run_baseline_only:
            when: ".suite == \"baseline\""
            then: "baseline_mkdir"
        - default:
            then: "burst_gate"
  - baseline_mkdir:
      call: "run_step"
      with:
        name: "mkdir"
        command: "SDFATMKDIR {base_path}"
        ack_tag: "SDFATMKDIR"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "mkdir_ok path="
      then: "baseline_write"
  - baseline_write:
      call: "run_step"
      with:
        name: "write"
        command: "SDFATWRITE {test_file} hello"
        ack_tag: "SDFATWRITE"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "write_ok .* verify=ok"
      then: "baseline_read_hello"
  - baseline_read_hello:
      call: "run_step"
      with:
        name: "read_hello"
        command: "SDFATREAD {test_file}"
        ack_tag: "SDFATREAD"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "read_ok .* preview_hex=68656c6c6f"
      then: "baseline_append"
  - baseline_append:
      call: "run_step"
      with:
        name: "append"
        command: "SDFATAPPEND {test_file} _world"
        ack_tag: "SDFATAPPEND"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "append_ok"
      then: "baseline_stat"
  - baseline_stat:
      call: "run_step"
      with:
        name: "stat"
        command: "SDFATSTAT {test_file}"
        ack_tag: "SDFATSTAT"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "stat_ok .* kind=file"
      then: "baseline_truncate"
  - baseline_truncate:
      call: "run_step"
      with:
        name: "truncate"
        command: "SDFATTRUNC {test_file} 5"
        ack_tag: "SDFATTRUNC"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "trunc_ok"
      then: "baseline_rename"
  - baseline_rename:
      call: "run_step"
      with:
        name: "rename"
        command: "SDFATREN {test_file} {test_file_renamed}"
        ack_tag: "SDFATREN"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "ren_ok"
      then: "baseline_remove_file"
  - baseline_remove_file:
      call: "run_step"
      with:
        name: "remove_file"
        command: "SDFATRM {test_file_renamed}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "rm_ok"
      then: "baseline_remove_dir"
  - baseline_remove_dir:
      call: "run_step"
      with:
        name: "remove_dir"
        command: "SDFATRM {base_path}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "rm_ok"
      then: "baseline_raw_rw_verify"
  - baseline_raw_rw_verify:
      call: "run_step"
      with:
        name: "raw_rw_verify"
        command: "SDRWVERIFY {verify_lba}"
        ack_tag: "SDRWVERIFY"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "verify_ok"
      then: "burst_gate"
  - burst_gate:
      switch:
        - run_burst_cutover:
            when: ".suite == \"cutover\""
            then: "burst_batch_start"
        - run_burst_all:
            when: ".suite == \"all\""
            then: "burst_batch_start"
        - run_burst_only:
            when: ".suite == \"burst\""
            then: "burst_batch_start"
        - default:
            then: "failure_gate"
  - burst_batch_start:
      call: "burst_batch_start"
      with:
        commands:
          - "SDFATMKDIR {burst_root}"
          - "SDFATWRITE {burst_file} A"
          - "SDFATAPPEND {burst_file} BC"
          - "SDFATSTAT {burst_file}"
          - "SDFATREAD {burst_file}"
      then: "burst_batch_assert"
  - burst_batch_assert:
      call: "burst_batch_assert"
      with:
        name: "burst_sequence"
        expected_sdreq_count: 5
        expected_status: "ok"
        expected_code: "ok"
        poll_timeout_ms: 30000
        busy_pattern: "SDFAT(MKDIR|WRITE|APPEND|STAT|READ) BUSY"
      then: "burst_cleanup_file"
  - burst_cleanup_file:
      call: "run_step"
      with:
        name: "burst_cleanup_file"
        command: "SDFATRM {burst_file}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "rm_ok"
      then: "burst_cleanup_dir"
  - burst_cleanup_dir:
      call: "run_step"
      with:
        name: "burst_cleanup_dir"
        command: "SDFATRM {burst_root}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
        expected_pattern: "rm_ok"
      then: "failure_gate"
  - failure_gate:
      switch:
        - run_failure_cutover:
            when: ".suite == \"cutover\""
            then: "fail_mkdir_nonempty"
        - run_failure_all:
            when: ".suite == \"all\""
            then: "fail_mkdir_nonempty"
        - run_failure_only:
            when: ".suite == \"failures\""
            then: "fail_mkdir_nonempty"
        - default:
            then: "final_gate"
  - fail_mkdir_nonempty:
      call: "run_step"
      with:
        name: "fail_mkdir_nonempty"
        command: "SDFATMKDIR {fail_root}"
        ack_tag: "SDFATMKDIR"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_write_nonempty"
  - fail_write_nonempty:
      call: "run_step"
      with:
        name: "fail_write_nonempty"
        command: "SDFATWRITE {fail_root}/child.txt x"
        ack_tag: "SDFATWRITE"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_rm_non_empty_dir"
  - fail_rm_non_empty_dir:
      call: "run_step"
      with:
        name: "fail_rm_non_empty_dir"
        command: "SDFATRM {fail_root}"
        ack_tag: "SDFATRM"
        expected_status: "error"
        expected_code: "operation_failed"
        expected_pattern: "rm_error .* (err=)?NotEmpty"
      then: "fail_cleanup_child"
  - fail_cleanup_child:
      call: "run_step"
      with:
        name: "fail_cleanup_child"
        command: "SDFATRM {fail_root}/child.txt"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_cleanup_dir"
  - fail_cleanup_dir:
      call: "run_step"
      with:
        name: "fail_cleanup_dir"
        command: "SDFATRM {fail_root}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_mkdir_rename"
  - fail_mkdir_rename:
      call: "run_step"
      with:
        name: "fail_mkdir_rename"
        command: "SDFATMKDIR {rename_root}"
        ack_tag: "SDFATMKDIR"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_write_a"
  - fail_write_a:
      call: "run_step"
      with:
        name: "fail_write_a"
        command: "SDFATWRITE {file_a} one"
        ack_tag: "SDFATWRITE"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_write_b"
  - fail_write_b:
      call: "run_step"
      with:
        name: "fail_write_b"
        command: "SDFATWRITE {file_b} two"
        ack_tag: "SDFATWRITE"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_rename_collision"
  - fail_rename_collision:
      call: "run_step"
      with:
        name: "fail_rename_collision"
        command: "SDFATREN {file_a} {file_b}"
        ack_tag: "SDFATREN"
        expected_status: "error"
        expected_code: "operation_failed"
        expected_pattern: "ren_error .* (err=)?AlreadyExists"
      then: "fail_read_not_found"
  - fail_read_not_found:
      call: "run_step"
      with:
        name: "fail_read_not_found"
        command: "SDFATREAD {rename_root}/missing.txt"
        ack_tag: "SDFATREAD"
        expected_status: "error"
        expected_code: "not_found"
        expected_pattern: "read_error .* (err=)?NotFound"
      then: "fail_rw_refused_lba0"
  - fail_rw_refused_lba0:
      call: "run_step"
      with:
        name: "fail_rw_refused_lba0"
        command: "SDRWVERIFY 0"
        ack_tag: "SDRWVERIFY"
        expected_status: "error"
        expected_code: "refused_lba0"
        expected_pattern: "refused_lba0"
      then: "fail_cleanup_a"
  - fail_cleanup_a:
      call: "run_step"
      with:
        name: "fail_cleanup_a"
        command: "SDFATRM {file_a}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_cleanup_b"
  - fail_cleanup_b:
      call: "run_step"
      with:
        name: "fail_cleanup_b"
        command: "SDFATRM {file_b}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_cleanup_rename_dir"
  - fail_cleanup_rename_dir:
      call: "run_step"
      with:
        name: "fail_cleanup_rename_dir"
        command: "SDFATRM {rename_root}"
        ack_tag: "SDFATRM"
        expected_status: "ok"
        expected_code: "ok"
      then: "fail_oversize_payload_cmd_err"
  - fail_oversize_payload_cmd_err:
      call: "raw_expect_pattern"
      with:
        name: "fail_oversize_payload_cmd_err"
        command: "SDFATWRITE {base_path}/overflow.txt {long_payload}"
        expected_pattern: "^CMD ERR"
        timeout_ms: 20000
      then: "final_gate"
  - final_gate:
      switch:
        - cutover_summary:
            when: ".suite == \"cutover\""
            then: "cutover_summary"
        - default:
            then: "complete"
  - cutover_summary:
      call: "cutover_summary"
      then: "complete"
  - complete:
      call: "complete"
