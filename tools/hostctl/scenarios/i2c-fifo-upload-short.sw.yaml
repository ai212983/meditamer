document:
  dsl: "1.0.0"
  namespace: "hostctl"
  name: "i2c-fifo-upload-short"
  version: "1.0.0"
do:
  - experiment:
      try:
        - attach:
            call: "verify_attach"
        - await_input:
            call: "await_operator"
        - select_upload:
            call: "set_scheduler"
            with:
              profile: "UPLOAD"
        - probe_upload:
            call: "probe_metrics_control"
        - reset_upload:
            call: "reset_scheduling_metrics"
        - demand_upload:
            call: "acquisition_window"
        - begin_upload:
            call: "begin_phase"
            with:
              name: "upload"
              paused: false
        - observe_upload:
            call: "capture_window"
            with:
              seconds: 34
        - final_upload:
            call: "capture_window"
            with:
              seconds: 2
        - check_upload:
            call: "check_scheduling"
            with:
              require_touch: true
              min_touch_samples: 50
              defer_qualification_failure: true
        - finish_upload:
            call: "finish_phase"
      catch:
        as: "experiment_error"
  - restore:
      try:
        - automatic:
            call: "set_scheduler"
            with:
              profile: "AUTO"
      catch:
        as: "restore_error"
  - reset_capture_gate:
      switch:
        - failed:
            when: "present(.experiment_error) || present(.restore_error)"
            then: "capture_reset_trace"
        - default:
            then: "finish"
  - capture_reset_trace:
      call: "capture_reset_trace"
      with:
        seconds: 120
  - finish:
      call: "finish"
