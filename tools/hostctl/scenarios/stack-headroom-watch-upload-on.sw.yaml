document:
  dsl: "1.0.0"
  namespace: "hostctl"
  name: "stack-headroom-watch-upload-on"
  version: "1.0.0"
do:
  # Control variant for the no-fault stall hunt: identical grid, but the
  # upload service is switched ON right after Ambient adoption, forcing the
  # HTTP listener accept loop and the upload state machine on. This exists
  # because STATE SET persists across boots: after any upload-off run the
  # device would otherwise boot with the service still off, silently
  # voiding an upload-on control. If this configuration hangs with the
  # serial-silence signature seen in watch3-5, the upload path is confirmed
  # and the hunt moves inside it. Expect `listening on` at boot and
  # `reachable=true` probes until a hang: `refused` means the stack is
  # alive with the port closed, `TimedOut` means it died with the stream.
  # A missed correlated serial reply pair or unreachable TCP listener aborts
  # on the first failed grid point. The result_gate below is
  # EXPECTED to fail: mountain/clock checkpoints never apply here. Never
  # flashes firmware and sends no upload bytes.
  - measurement:
      try:
        - init_run:
            call: "init_run"
        - preflight_state:
            call: "state_probe"
            metadata:
              hostctl:
                result:
                  merge: true
        - await_ambient_assets:
            call: "await_marker"
            with:
              key: "ambient_assets_adopted"
              checkpoint: "ambient_assets_adopted"
              from: "run"
              silence_limit_secs: 45
        - enable_upload:
            call: "state_command"
            with:
              upload: "on"
        - poll_loop:
            do:
              - sample:
                  call: "metrics_sample"
                  with:
                    settle_secs: 30
                    abort_after_consecutive_misses: 1
              - net_probe:
                  call: "net_liveness"
                  with:
                    timeout_secs: 5
                    require_reachable: true
            metadata:
              hostctl:
                repeat:
                  in: 30
                  at: "sample_index"
      catch:
        as: "measurement_error"
      then: "cleanup_upload"
  - cleanup_upload:
      call: "cleanup_upload_off"
      then: "finalize"
  - finalize:
      call: "finalize_report"
      metadata:
        hostctl:
          result:
            merge: true
      then: "result_gate"
  - result_gate:
      switch:
        - passed:
            when: ".run_passed == true"
            then: "print_summary"
        - default:
            then: "fail_evidence"
  - print_summary:
      call: "print_summary"
      then: "__end__"
  - fail_evidence:
      call: "fail_evidence"
