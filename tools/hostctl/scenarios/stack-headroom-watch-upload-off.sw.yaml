document:
  dsl: "1.0.0"
  namespace: "hostctl"
  name: "stack-headroom-watch-upload-off"
  version: "1.0.0"
do:
  # Bisection variant of stack-headroom-watch for the no-fault stall hunt:
  # identical grid, but the upload service is switched off right after
  # Ambient adoption, gating the HTTP listener accept loop and the upload
  # state machine while Wi-Fi stays associated. If this configuration stops
  # hanging, the listener/upload path is implicated; if it hangs with the
  # same serial-silence signature, the listener is exonerated and the stall
  # lives elsewhere (radio core, power/clock, or a non-upload deadlock).
  # With the listener down, probe the live METRICS NET IP at the upload port:
  # `refused` is a TCP response from a live stack; a timeout or missing IP
  # aborts the run. One unanswered serial pair also aborts. The result_gate
  # below is
  # EXPECTED to fail: mountain/clock checkpoints never apply here. Never
  # flashes firmware and sends no upload bytes.
  - measurement:
      try:
        - init_run:
            call: "init_run"
        - preflight_state:
            call: "state_probe"
            metadata:
              hostctl:
                result:
                  merge: true
        - await_ambient_assets:
            call: "await_marker"
            with:
              key: "ambient_assets_adopted"
              checkpoint: "ambient_assets_adopted"
              from: "run"
              silence_limit_secs: 45
        - disable_upload:
            call: "state_command"
            with:
              upload: "off"
        - poll_loop:
            do:
              - sample:
                  call: "metrics_sample"
                  with:
                    settle_secs: 30
                    abort_after_consecutive_misses: 1
              - net_probe:
                  call: "net_liveness"
                  with:
                    timeout_secs: 5
                    allow_closed_listener: true
                    require_response: true
            metadata:
              hostctl:
                repeat:
                  in: 30
                  at: "sample_index"
      catch:
        as: "measurement_error"
      then: "cleanup_upload"
  - cleanup_upload:
      call: "cleanup_upload_off"
      then: "finalize"
  - finalize:
      call: "finalize_report"
      metadata:
        hostctl:
          result:
            merge: true
      then: "result_gate"
  - result_gate:
      switch:
        - passed:
            when: ".run_passed == true"
            then: "print_summary"
        - default:
            then: "fail_evidence"
  - print_summary:
      call: "print_summary"
      then: "__end__"
  - fail_evidence:
      call: "fail_evidence"
